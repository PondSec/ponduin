[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ponduin-sdk"
version = "0.1.0a5"
description = "Python bindings for the Ponduin SDK"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-PondSec-Ponduin-0.1"
authors = [{ name = "PondSec" }]
keywords = ["ponduin", "sdk", "ai", "agent", "uniffi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/PondSec/ponduin"
Repository = "https://github.com/PondSec/ponduin"
Issues = "https://github.com/PondSec/ponduin/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ponduin = ["*.so", "*.dylib", "*.dll", "py.typed"]
