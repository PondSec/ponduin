# This workflow is for canary releases, automatically triggered by push to main
# This workflow is identical to "release.yml" with these exceptions:
#  - Triggered by push to main
#  - GitHub Release tagged as "canary"
on:
  push:
    paths-ignore:
      - "documentation/**"
    branches:
      - main

name: Canary

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------
  # 1) Prepare Version
  # ------------------------------------
  prepare-version:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      # checkout code so we can read the Cargo.toml
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Generate a canary version
        id: set-version
        run: |
          # Main builds use the next patch as a prerelease. This is newer than
          # the current stable version, monotonic across main runs, and still
          # older than the eventual next stable release.
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BASE_VERSION=$(grep '^version\s*=' Cargo.toml | head -n 1 | cut -d\" -f2)
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          NEXT_PATCH=$((10#$PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-main.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # ------------------------------------
  # 2) Build CLI targets not produced by desktop workflows
  # ------------------------------------
  build-cli-linux:
    needs: [prepare-version]
    uses: ./.github/workflows/build-cli-linux.yml
    with:
      version: ${{ needs.prepare-version.outputs.version }}

  # ------------------------------------
  # 3) Upload Install CLI Script (we only need to do this once)
  # ------------------------------------
  install-script:
    name: Upload Install Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: download_cli.sh
          path: download_cli.sh

  # ------------------------------------------------------------
  # 4) Bundle CLI and Desktop (macOS ARM64)
  # ------------------------------------------------------------
  bundle-macos-arm64:
    needs: [prepare-version]
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.prepare-version.outputs.version }}
      target: aarch64-apple-darwin
      package_cli: true
      package_desktop: true
      signing: false

  # ------------------------------------------------------------
  # 5) Bundle CLI and Desktop (macOS x64)
  # ------------------------------------------------------------
  bundle-macos-x64:
    needs: [prepare-version]
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.prepare-version.outputs.version }}
      target: x86_64-apple-darwin
      package_cli: true
      package_desktop: true
      signing: false

  # ------------------------------------------------------------
  # 6) Bundle Desktop App (Linux)
  # ------------------------------------------------------------
  bundle-desktop-linux:
    needs: [prepare-version]
    uses: ./.github/workflows/bundle-desktop-linux.yml
    with:
      version: ${{ needs.prepare-version.outputs.version }}

  # ------------------------------------------------------------
  # 7) Bundle CLI and Desktop (Windows)
  # ------------------------------------------------------------
  bundle-windows:
    needs: [prepare-version]
    uses: ./.github/workflows/bundle-windows.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.prepare-version.outputs.version }}
      package_cli: true
      package_desktop: true
      signing: false

  bundle-windows-cuda:
    needs: [prepare-version]
    uses: ./.github/workflows/bundle-windows.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.prepare-version.outputs.version }}
      package_cli: true
      package_desktop: true
      signing: false
      windows_variant: cuda

  # ------------------------------------
  # 8) Create/Update GitHub Release
  # ------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      [
        prepare-version,
        build-cli-linux,
        install-script,
        bundle-macos-arm64,
        bundle-macos-x64,
        bundle-desktop-linux,
        bundle-windows,
        bundle-windows-cuda,
      ]
    permissions:
      contents: write
      id-token: write # Required for Sigstore OIDC signing
      attestations: write # Required for SLSA build provenance attestations

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "!internal-*"
          merge-multiple: true

      - name: Generate main update manifests
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
        run: node ui/desktop/scripts/generate-main-update-manifests.js --version "$VERSION" --directory .

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ponduin-*.tar.bz2
            ponduin-*.tar.gz
            ponduin-*.zip
            Ponduin*.zip
            *.deb
            *.rpm
            *.flatpak
            download_cli.sh
            latest-mac.yml
            latest-linux.yml
            latest.yml

      # Create/update the canary release
      - name: Release canary
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: canary
          name: Main ${{ needs.prepare-version.outputs.version }}
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            ponduin-*.tar.bz2
            ponduin-*.tar.gz
            ponduin-*.zip
            Ponduin*.zip
            *.deb
            *.rpm
            *.flatpak
            download_cli.sh
            latest-mac.yml
            latest-linux.yml
            latest.yml
          allowUpdates: true
          omitBody: true
          prerelease: true
          makeLatest: false
          omitPrereleaseDuringUpdate: true
          artifactErrorsFailBuild: true
